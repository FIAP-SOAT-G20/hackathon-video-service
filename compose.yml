services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/fiap-soat-g20/hackathon-video-service:latest
    container_name: app.hackathon.dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_DSN=postgres://postgres:postgres@db:5432/fiapx?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fiapx_video_network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # image: ghcr.io/fiap-soat-g20/hackathon-video-service:latest
    container_name: worker.hackathon.dev
    env_file:
      - .env
    environment:
      - DB_DSN=postgres://postgres:postgres@db:5432/fiapx?sslmode=disable
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fiapx_video_network
    restart: unless-stopped

  db:
    image: postgres:17-alpine3.21
    container_name: fiapx-db.hackathon.dev
    environment:
      POSTGRES_DB: fiapx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - fiapx_video_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dbadmin:
    image: dpage/pgadmin4
    container_name: fiapx-dbadmin.hackathon.dev
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - fiapx_video_network
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  fiapx_video_network:
    driver: bridge
