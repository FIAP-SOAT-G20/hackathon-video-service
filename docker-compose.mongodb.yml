# Docker Compose for DocumentDB/MongoDB Integration Testing
version: '3.8'

services:

  # MongoDB service (DocumentDB compatible)
  documentdb:
    image: mongo:7.0
    container_name: db-video.hackathon.dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: video_service
    ports:
      - "27017:27017"
    volumes:
      - db:/data/db
      - ./scripts/init-mongodb.js:/docker-entrypoint-initdb.d/init-mongodb.js:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ff_video_network

  # Mongo Express - MongoDB Web UI
  mongo-express:
    image: mongo-express:1.0.0
    container_name: mongo-express.hackathon.dev
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@documentdb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: false
      ME_CONFIG_MONGODB_ENABLE_ADMIN: true
      ME_CONFIG_SITE_BASEURL: /
    ports:
      - "8082:8081"
    depends_on:
      documentdb:
        condition: service_healthy
    networks:
      - ff_video_network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app.hackathon.dev
    environment:
      - DOCUMENTDB_URI=mongodb://admin:password@db:27017/video_service?authSource=admin
      - DOCUMENTDB_NAME=video_service
      - DOCUMENTDB_TLS_ENABLED=false
      - ENVIRONMENT=mongodb
      - SERVER_PORT=8081
      - JWT_SECRET=your-jwt-secret-key
    ports:
      - "8081:8081"
    depends_on:
      documentdb:
        condition: service_healthy
    networks:
      - ff_video_network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker.consumer
    # image: ghcr.io/fiap-soat-g20/hackathon-video-service-worker:latest
    container_name: worker.hackathon.dev
    env_file:
      - .env
    environment:
      - DB_DSN=mongodb://admin:password@db:27017/video_service?authSource=admin
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    depends_on:
      documentdb:
        condition: service_healthy
    networks:
      - ff_video_network
    restart: unless-stopped

volumes:
  # postgres_data:
  db:


networks:
  ff_video_network:
    driver: bridge
